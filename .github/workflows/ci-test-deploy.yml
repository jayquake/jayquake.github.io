  # =====================================================================
  # Deploy — GitHub Actions → Pages
  # username.github.io user sites cannot publish from the gh-pages branch;
  # they require Source = GitHub Actions (Settings → Pages).
  # =====================================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Independent of test lanes so Pages can publish even when SDK tests fail/hang.
    # One-time setup (repo admin): Settings → Pages → Source: GitHub Actions
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      ) || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          GCP_SDK_NPM_REGISTRY_URL: us-east1-npm.pkg.dev/accessflow-rm5h5j8lmu/stag-accessflow-npm
          ACCESSFLOW_NPM_REGISTRY_TOKEN: ${{ secrets.ACCESSFLOW_NPM_REGISTRY_TOKEN }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          CI: false
          REACT_APP_STATIC_ONLY: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Production URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Site: https://${{ github.repository_owner }}.github.io/"
          echo "Deployed at: $(date)"

      - name: Pages not enabled hint
        if: failure()
        run: |
          echo "::error::GitHub Pages deploy failed. As repo admin, open Settings → Pages and set Source to 'GitHub Actions', then re-run this workflow."
          echo "https://github.com/${{ github.repository }}/settings/pages"
  # =====================================================================
  # Accessibility Summary (from ALL SDK lanes)
  # =====================================================================
  accessibility-summary:
    name: Accessibility Test Summary (All SDKs)
    runs-on: ubuntu-latest
    needs:
      - test-js
      - test-js-selenium
    # Run after every lane finishes so artifacts exist; still emit a summary if some lanes failed
    if: always()

    steps:
      - name: Download Python Selenium Test Results
        uses: actions/download-artifact@v4
        with:
          name: python-selenium-test-results
          path: python-selenium-results
        continue-on-error: true

      - name: Download Python Test Results
        uses: actions/download-artifact@v4
        with:
          name: python-test-results
          path: python-results
        continue-on-error: true

      - name: Download Java Playwright Test Results
        uses: actions/download-artifact@v4
        with:
          name: java-playwright-test-results
          path: java-results
        continue-on-error: true

      - name: Download Java Selenium Test Results
        uses: actions/download-artifact@v4
        with:
          name: java-selenium-test-results
          path: java-selenium-results
        continue-on-error: true

      - name: Display Comprehensive AccessFlow Summary
        run: |
          echo "## 🔍 Accessibility Test Summary (All SDKs)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ========== Python Selenium SDK Results ==========
          echo "### 📦 Python Selenium SDK Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "python-selenium-results/accessFlow-report-summary.json" ]; then
            echo "✅ **AccessFlow audit completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat python-selenium-results/accessFlow-report-summary.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No AccessFlow summary found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ========== Python SDK Results ==========
          echo "### 🐍 Python SDK Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "python-results/accessflow-full-app-report.json" ]; then
            echo "✅ **AccessFlow audit completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat python-results/accessflow-full-app-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ -f "python-results/accessflow-local-report.json" ]; then
            echo "✅ **AccessFlow audit completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat python-results/accessflow-local-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No AccessFlow summary found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ========== Java SDK Results ==========
          echo "### ☕ Java SDK Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "java-results/accessflow-report-summary.json" ]; then
            echo "✅ **AccessFlow audit completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat java-results/accessflow-report-summary.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No AccessFlow summary found (teardown may need configuration)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ========== Java Selenium SDK Results ==========
          echo "### ☕🔧 Java Selenium SDK Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "java-selenium-results/accessflow-report-summary.json" ]; then
            echo "✅ **AccessFlow audit completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat java-selenium-results/accessflow-report-summary.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No AccessFlow summary found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ========== Test Artifacts ==========
          echo "### 📂 Test Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 \`python-selenium-test-results\` - Python Selenium test data + AccessFlow reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 \`java-selenium-test-results\` - Java Selenium test data + AccessFlow reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 \`python-test-results\` - Python test data + AccessFlow reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 \`java-playwright-test-results\` - Java Playwright test data + AccessFlow reports" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 \`js-test-results\` / \`js-selenium-test-results\` - Node SDK Playwright / Selenium artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
