name: CI, Test & Deploy

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # =====================================================================
  # JS Lane — Playwright + AccessFlow Node SDK
  # =====================================================================
  test-js:
    name: JS Lane — Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          GCP_SDK_NPM_REGISTRY_URL: us-east1-npm.pkg.dev/accessflow-rm5h5j8lmu/stag-accessflow-npm
          ACCESSFLOW_NPM_REGISTRY_TOKEN: ${{ secrets.ACCESSFLOW_NPM_REGISTRY_TOKEN }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          CI: false
          SKIP_PRERENDER: '1'
        run: |
          if [ -z "$AF_NODE_PACKAGE_KEY" ]; then
            echo "::error::Add AF_NODE_PACKAGE_KEY to this repo's GitHub Secrets."
            exit 1
          fi
          echo "AccessFlow API key is set."
        env:
          AF_NODE_PACKAGE_KEY: ${{ secrets.AF_NODE_PACKAGE_KEY }}

      - name: Run JS Playwright Tests
        run: cd sdk/tests/playwright/node && npx playwright test tests/fake-login-flow.spec.js tests/sdk-audit-smoke.spec.js
        env:
          CI: true
          AF_NODE_PACKAGE_KEY: ${{ secrets.AF_NODE_PACKAGE_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-playwright-report
          path: sdk/tests/playwright/node/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-test-results
          path: sdk/tests/playwright/node/test-results/
          retention-days: 30

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-playwright
          path: build/
          retention-days: 7

  # =====================================================================
  # JS Lane — Selenium + AccessFlow Node SDK
  # =====================================================================
  test-js-selenium:
    name: JS Lane — Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          GCP_SDK_NPM_REGISTRY_URL: us-east1-npm.pkg.dev/accessflow-rm5h5j8lmu/stag-accessflow-npm
          ACCESSFLOW_NPM_REGISTRY_TOKEN: ${{ secrets.ACCESSFLOW_NPM_REGISTRY_TOKEN }}

      - name: Install Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build application
        run: npm run build
        env:
          CI: false
          SKIP_PRERENDER: '1'

      - name: Start application server
        run: npx serve -s build -l 3000 &
        env:
          CI: true

      - name: Wait for application
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && echo "App ready!" && exit 0
            sleep 1
          done
          echo "App did not start within 60 s" && exit 1

      - name: Ensure AccessFlow API key is set (JS Selenium)
        run: |
          if [ -z "$AF_NODE_PACKAGE_KEY" ] && [ -z "$ACCESSFLOW_SDK_API_KEY" ]; then
            echo "::error::Add AF_NODE_PACKAGE_KEY or ACCESSFLOW_SDK_API_KEY to this repo's GitHub Secrets."
            exit 1
          fi
          echo "AccessFlow API key is set."
        env:
          AF_NODE_PACKAGE_KEY: ${{ secrets.AF_NODE_PACKAGE_KEY }}
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}

      - name: Run JS Selenium Tests
        run: cd sdk/tests/selenium/node && npx jest --config jest.config.js --forceExit
        env:
          CI: true
          HEADLESS: true
          BASE_URL: http://localhost:3000
          AF_NODE_PACKAGE_KEY: ${{ secrets.AF_NODE_PACKAGE_KEY }}
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}

      - name: Upload Selenium Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-selenium-test-results
          path: sdk/tests/selenium/node/test-results/
          retention-days: 30

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

