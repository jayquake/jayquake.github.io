<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay in the loop</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .hero {
        display: block;
        margin: 1rem 0;
        border-radius: 4px;
      }
      #subscribe-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        align-items: center;
        justify-content: center;
      }
      #subscribe-modal.open {
        display: flex;
      }
      .modal-card {
        background: #fff;
        padding: 1.5rem;
        border-radius: 8px;
        width: min(24rem, 90vw);
        position: relative;
      }
      .error {
        color: #d93025;
        font-size: 14px;
        display: none;
      }
      .error.shown {
        display: block;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
      input {
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #subscribe-close {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        border: none;
        background: transparent;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main id="subscribe-page" data-fixture="sdk-local-demo">
      <h1 id="subscribe-heading">Stay in the loop</h1>
      <img
        class="hero"
        id="subscribe-hero"
        src="hero.png"
        width="320"
        height="180"
      />
      <p>Get product news and accessibility tips in your inbox.</p>
      <p>We ship often — catch issues before they reach production.</p>
      <button id="subscribe-open" type="button">Subscribe</button>
    </main>

    <div id="subscribe-modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-card">
        <button id="subscribe-close" type="button" aria-label="Close">×</button>
        <h2 id="modal-title">Subscribe to Acme Weekly</h2>
        <form id="subscribe-form" novalidate>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />

          <p id="subscribe-error" class="error" role="alert">
            Please enter a valid email address.
          </p>

          <button id="subscribe-submit" type="submit">Subscribe</button>
        </form>
      </div>
    </div>

    <script>
      const modal = document.getElementById("subscribe-modal");
      const errorEl = document.getElementById("subscribe-error");

      document
        .getElementById("subscribe-open")
        .addEventListener("click", () => {
          errorEl.classList.remove("shown");
          modal.classList.add("open");
        });

      document
        .getElementById("subscribe-close")
        .addEventListener("click", () => {
          modal.classList.remove("open");
        });

      document
        .getElementById("subscribe-form")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          errorEl.classList.toggle("shown", !valid);
        });
    </script>
    <footer>
      <p>© Acme — accessibility demo page</p>
    </footer>
  </body>
</html>
